<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" fill="none" role="img" aria-label="Andrés Felipe Guerra — Fullstack Software Engineer">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="0.82" cy="0.46" r="0.38">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#1D4ED8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid60" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#EFF4FB" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="282" rx="16"/>
    </clipPath>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.88); }
      }
      @keyframes ring {
        0% { opacity: 0.65; transform: scale(1); }
        100% { opacity: 0; transform: scale(2.35); }
      }
      @keyframes sweep {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(580px); }
      }
      .dotPulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
      .ringPulse { transform-box: fill-box; transform-origin: center; animation: ring 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .beam { animation: sweep 5.2s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="1198" height="282" rx="16" fill="url(#heroBg)"/>
    <rect x="1" y="1" width="1198" height="282" fill="url(#grid60)"/>
    <rect x="1" y="1" width="1198" height="282" fill="url(#ambientGlow)"/>

    <!-- Corner registration marks -->
    <path d="M 18 34 L 18 18 L 34 18" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.55" fill="none"/>
    <path d="M 1166 18 L 1182 18 L 1182 34" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.55" fill="none"/>
    <path d="M 18 250 L 18 266 L 34 266" stroke="#CBD5E1" stroke-width="1.5" fill="none"/>
    <path d="M 1166 266 L 1182 266 L 1182 250" stroke="#CBD5E1" stroke-width="1.5" fill="none"/>

    <!-- Top royal-blue specular hairline -->
    <line x1="80" y1="1.5" x2="1120" y2="1.5" stroke="url(#topEdge)" stroke-width="1.5"/>

    <!-- Left Editorial Column -->
    <g transform="translate(52, 46)">
      <!-- Eyebrow pill -->
      <rect x="0" y="0" width="328" height="28" rx="14" fill="#EFF6FF" stroke="rgba(29, 78, 216, 0.28)" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#2563EB" class="ringPulse"/>
      <circle cx="16" cy="14" r="3.6" fill="#2563EB" class="dotPulse"/>
      <text x="30" y="18.5" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#2563EB">AG ENGINEERING  ·  AVAILABLE 2026</text>

      <!-- Display Name -->
      <text x="0" y="84" class="sans" font-size="46" font-weight="700" letter-spacing="-1.3" fill="#0F172A">Andrés Felipe Guerra</text>

      <!-- Subtitle -->
      <text x="0" y="120" class="sans" font-size="18.5" font-weight="500" letter-spacing="-0.15" fill="#475569">Fullstack Software Engineer  ·  AI Systems &amp; Security Automation</text>

      <!-- Structural laser hairline -->
      <g transform="translate(0, 148)">
        <rect x="0" y="0" width="540" height="2" rx="1" fill="#E2E8F0"/>
        <clipPath id="beamClip">
          <rect x="0" y="0" width="540" height="2" rx="1"/>
        </clipPath>
        <g clip-path="url(#beamClip)">
          <rect x="0" y="0" width="140" height="2" fill="url(#scanSweep)" class="beam"/>
        </g>
      </g>

      <!-- Metadata footer coordinates -->
      <text x="0" y="186" class="mono" font-size="11.5" font-weight="500" letter-spacing="0.5" fill="#64748B">
        <tspan fill="#2563EB" font-weight="600">LOC</tspan>  Bucaramanga, CO    <tspan fill="#CBD5E1">|</tspan>    <tspan fill="#2563EB" font-weight="600">FOCUS</tspan>  RAG · DDD · CTI    <tspan fill="#CBD5E1">|</tspan>    <tspan fill="#2563EB" font-weight="600">WEB</tspan>  portfolio.agengineering.workers.dev
      </text>
    </g>

    <!-- Right AG Architectural Monogram & System Node -->
    <g transform="translate(970, 142)">
      <!-- Subtle outer dashed orbit ring -->
      <circle cx="0" cy="0" r="88" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 7" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="42s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="70" stroke="rgba(29, 78, 216, 0.28)" stroke-width="1.2" stroke-dasharray="38 14 10 14" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="28s" repeatCount="indefinite"/>
      </circle>

      <!-- Octagonal Shield Core -->
      <polygon points="0,-54 46,-28 46,24 0,54 -46,24 -46,-28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <polygon points="0,-46 39,-23 39,20 0,46 -39,20 -39,-23" fill="none" stroke="#1D4ED8" stroke-width="1.2" stroke-opacity="0.45"/>

      <!-- Geometric AG Monogram inside Shield -->
      <!-- Stylised A -->
      <path d="M -22 16 L -8 -18 L 4 16 M -17 5 L -1 5" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Stylised G -->
      <path d="M 24 -11 C 19 -17 10 -16 7 -8 L 7 7 C 7 15 17 18 24 12 L 24 2 L 15 2" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Precision crosshairs -->
      <line x1="-106" y1="0" x2="-92" y2="0" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="92" y1="0" x2="106" y2="0" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="0" cy="-88" r="2.6" fill="#2563EB"/>
      <circle cx="0" cy="88" r="2.2" fill="#CBD5E1"/>

      <text x="0" y="114" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.8" fill="#64748B">SYSTEM ARCHITECTURE · 01</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="282" rx="16" stroke="#E2E8F0" stroke-width="1.2"/>
</svg>