          <text x="36" y="148" class="sans" font-size="12.6" fill="#DCE6FF">Aislamiento multi-tenant, JWT HS256 y RBAC</text>

          <line x1="22" y1="166" x2="364" y2="166" stroke="rgba(191, 219, 254, 0.16)" stroke-width="1"/>
          <text x="22" y="189" class="mono" font-size="11.2" font-weight="500" fill="#BFDBFE">Hexagonal · DDD · OpenAPI</text>
        
  </g>

