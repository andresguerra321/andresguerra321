          <line x1="22" y1="166" x2="364" y2="166" stroke="rgba(167, 243, 208, 0.16)" stroke-width="1"/>
          <text x="22" y="189" class="mono" font-size="11.2" font-weight="500" fill="#6EE7B7">Zero-Retention · Fail-Closed · MVT</text>
        
