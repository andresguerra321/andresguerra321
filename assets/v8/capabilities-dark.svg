    </g>
  </g>
          <text x="68" y="36" class="display" font-size="16.5" font-weight="600" letter-spacing="-0.25" fill="#F8FAFC">Sistemas de IA &amp; RAG</text>
          <text x="68" y="53" class="sans" font-size="12" font-weight="500" fill="#B4C7F4">Recuperación híbrida y salida estructurada</text>

          <line x1="22" y1="70" x2="364" y2="70" stroke="rgba(191, 219, 254, 0.16)" stroke-width="1"/>

          <circle cx="26" cy="92" r="2.2" fill="#BFDBFE"/>
