          <text x="68" y="36" class="display" font-size="16.5" font-weight="600" letter-spacing="-0.25" fill="#F8FAFC">AppSec &amp; Zero-Retention</text>
          <text x="68" y="53" class="sans" font-size="12" font-weight="500" fill="#6EE7B7">Contención, validación y evidencia volátil</text>

