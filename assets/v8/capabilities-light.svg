      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="capSecRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.08)"/>
      <stop offset="38%" stop-color="rgba(4, 120, 87, 0.14)"/>
      <stop offset="72%" stop-color="rgba(5, 150, 105, 0.30)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.08)"/>
    </linearGradient>
    <linearGradient id="capSecTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
