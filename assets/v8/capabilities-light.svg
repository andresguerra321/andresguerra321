<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" fill="none" role="img" aria-label="Capacidades Técnicas — Backend, IA y AppSec">
  <defs>
    
    <linearGradient id="capShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#F5F8FF" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="capTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="capRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.08)"/>
      <stop offset="38%" stop-color="rgba(29, 78, 216, 0.12)"/>
      <stop offset="72%" stop-color="rgba(29, 78, 216, 0.28)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.09)"/>
    </linearGradient>
    <linearGradient id="capTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.98)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.98)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="capSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
