    <g transform="translate(9, 9)">
      <path d="M9 2.8L15.4 6.1L9 9.4L2.6 6.1L9 2.8Z" stroke="#1E40AF" stroke-width="1.5" stroke-linejoin="round"/><path d="M2.6 9.3L9 12.6L15.4 9.3M2.6 12.4L9 15.7L15.4 12.4" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
          <text x="68" y="36" class="display" font-size="16.5" font-weight="600" letter-spacing="-0.25" fill="#1D1D1F">Backend &amp; Arquitectura</text>
          <text x="68" y="53" class="sans" font-size="12" font-weight="500" fill="#686870">Servicios modulares y persistencia auditada</text>

          <line x1="22" y1="70" x2="364" y2="70" stroke="rgba(15, 23, 42, 0.09)" stroke-width="1"/>

          <circle cx="26" cy="92" r="2.2" fill="#1E40AF"/>
          <text x="36" y="96" class="sans" font-size="12.6" fill="#424247">APIs stateless en Java 21, Spring Boot 3 y FastAPI</text>

          <circle cx="26" cy="118" r="2.2" fill="#1E40AF"/>
          <text x="36" y="122" class="sans" font-size="12.6" fill="#424247">Modelado PostgreSQL 16 (4FN) con Flyway y HNSW</text>

          <circle cx="26" cy="144" r="2.2" fill="#1E40AF"/>
          <text x="36" y="148" class="sans" font-size="12.6" fill="#424247">Aislamiento multi-tenant, JWT HS256 y RBAC</text>

          <line x1="22" y1="166" x2="364" y2="166" stroke="rgba(15, 23, 42, 0.09)" stroke-width="1"/>
          <text x="22" y="189" class="mono" font-size="11.2" font-weight="500" fill="#1E40AF">Hexagonal · DDD · OpenAPI</text>
        
  </g>

  <g transform="translate(407, 2)" filter="url(#capCardShadow)">
    <rect x="0.5" y="0.5" width="385" height="207" rx="20" fill="#F6F9FF"/>
    <rect x="0.5" y="0.5" width="385" height="207" rx="20" fill="url(#capShellBg)" stroke="url(#capRimStroke)" stroke-width="1"/>
    <line x1="26" y1="1.5" x2="360" y2="1.5" stroke="url(#capTopBevel)" stroke-width="1"/>
    
          
  <g transform="translate(22, 20)">
    <rect x="0.5" y="0.5" width="35" height="35" rx="9" fill="#FFFFFF" stroke="rgba(29, 78, 216, 0.12)" stroke-width="1"/>
    <g transform="translate(9, 9)">
      <circle cx="9" cy="4.2" r="1.7" stroke="#1E40AF" stroke-width="1.4"/><circle cx="4.3" cy="12.5" r="1.7" stroke="#1E40AF" stroke-width="1.4"/><circle cx="13.7" cy="12.5" r="1.7" stroke="#1E40AF" stroke-width="1.4"/><path d="M8.1 5.7L5.2 11M9.9 5.7L12.8 11M6 12.5H12" stroke="#1E40AF" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
          <text x="68" y="36" class="display" font-size="16.5" font-weight="600" letter-spacing="-0.25" fill="#1D1D1F">Sistemas de IA &amp; RAG</text>
          <text x="68" y="53" class="sans" font-size="12" font-weight="500" fill="#686870">Recuperación híbrida y salida estructurada</text>

          <line x1="22" y1="70" x2="364" y2="70" stroke="rgba(15, 23, 42, 0.09)" stroke-width="1"/>

          <circle cx="26" cy="92" r="2.2" fill="#1E40AF"/>
          <text x="36" y="96" class="sans" font-size="12.6" fill="#424247">Búsqueda RRF (pgvector + tsvector) con citas exactas</text>

          <circle cx="26" cy="118" r="2.2" fill="#1E40AF"/>
          <text x="36" y="122" class="sans" font-size="12.6" fill="#424247">Pipelines tipados en Pydantic y LangChain LCEL</text>

          <circle cx="26" cy="144" r="2.2" fill="#1E40AF"/>
          <text x="36" y="148" class="sans" font-size="12.6" fill="#424247">Reglas anti-alucinación y control de deriva</text>

          <line x1="22" y1="166" x2="364" y2="166" stroke="rgba(15, 23, 42, 0.09)" stroke-width="1"/>
          <text x="22" y="189" class="mono" font-size="11.2" font-weight="500" fill="#1E40AF">pgvector · RAGAS · LLMs</text>
        
  </g>

  <g transform="translate(814, 2)" filter="url(#capSecCardShadow)">
    <rect x="0.5" y="0.5" width="385" height="207" rx="20" fill="#F6FCF9"/>
    <rect x="0.5" y="0.5" width="385" height="207" rx="20" fill="url(#capSecShellBg)" stroke="url(#capSecRimStroke)" stroke-width="1"/>
    <line x1="26" y1="1.5" x2="360" y2="1.5" stroke="url(#capSecTopBevel)" stroke-width="1"/>
    
          
  <g transform="translate(22, 20)">
    <rect x="0.5" y="0.5" width="35" height="35" rx="9" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.22)" stroke-width="1"/>
    <g transform="translate(9, 9)">
      <path d="M9 2.5L14.5 4.8V8.8C14.5 12.1 12.1 14.6 9 15.6C5.9 14.6 3.5 12.1 3.5 8.8V4.8L9 2.5Z" stroke="#047857" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.7 9.1L8.3 10.7L11.6 7.4" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
          <text x="68" y="36" class="display" font-size="16.5" font-weight="600" letter-spacing="-0.25" fill="#0F172A">AppSec &amp; Zero-Retention</text>
          <text x="68" y="53" class="sans" font-size="12" font-weight="500" fill="#047857">Contención, validación y evidencia volátil</text>

          <line x1="22" y1="70" x2="364" y2="70" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>

          <circle cx="26" cy="92" r="2.2" fill="#047857"/>
          <text x="36" y="96" class="sans" font-size="12.6" fill="#1E293B">Ingesta en tmpfs y análisis RAM (:memory:)</text>

          <circle cx="26" cy="118" r="2.2" fill="#047857"/>
          <text x="36" y="122" class="sans" font-size="12.6" fill="#1E293B">Redes aisladas sin puertos públicos y anti-IDOR</text>

          <circle cx="26" cy="144" r="2.2" fill="#047857"/>
          <text x="36" y="148" class="sans" font-size="12.6" fill="#1E293B">Sanitización PDF AST, anti-Zip-Slip y hash SHA-256</text>

          <line x1="22" y1="166" x2="364" y2="166" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>
          <text x="22" y="189" class="mono" font-size="11.2" font-weight="500" fill="#047857">Zero-Retention · Fail-Closed · MVT</text>
        
  </g>
