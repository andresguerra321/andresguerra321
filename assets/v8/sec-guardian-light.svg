    </filter>
    <filter id="secCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.075"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>
  
  <g transform="translate(0, 2)" filter="url(#secCardShadow)">
    <rect x="0.5" y="0.5" width="385" height="183" rx="18" fill="#F6F9FF"/>
    <rect x="0.5" y="0.5" width="385" height="183" rx="18" fill="url(#secShellBg)" stroke="url(#secRimStroke)" stroke-width="1"/>
    <line x1="24" y1="1.5" x2="362" y2="1.5" stroke="url(#secTopBevel)" stroke-width="1"/>
    
      
  <g transform="translate(20, 18)">
    <rect x="0.5" y="0.5" width="33" height="33" rx="9" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.22)" stroke-width="1"/>
    <g transform="translate(8, 8)">
      <path d="M2.4 9C3.9 5.9 6.3 4.4 9 4.4C11.7 4.4 14.1 5.9 15.6 9C14.1 12.1 11.7 13.6 9 13.6C6.3 13.6 3.9 12.1 2.4 9Z" stroke="#047857" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.2" stroke="#047857" stroke-width="1.5"/>
    </g>
  </g>
      <text x="64" y="34" class="display" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#1D1D1F">GUARDIAN</text>
      <text x="64" y="51" class="sans" font-size="12.5" font-weight="500" fill="#047857">Seguridad Vial Multi-Agente</text>

      <line x1="20" y1="68" x2="366" y2="68" stroke="rgba(15, 23, 42, 0.09)" stroke-width="1"/>

      <text x="20" y="92" class="sans" font-size="14" font-weight="400" fill="#424247">Predice riesgos en transporte terrestre</text>
      <text x="20" y="112" class="sans" font-size="14" font-weight="400" fill="#424247">con 3 agentes (Copiloto, Centinela,</text>
      <text x="20" y="132" class="sans" font-size="14" font-weight="400" fill="#424247">Oráculo) sobre Voxel51 FiftyOne.</text>

      <text x="20" y="164" class="mono" font-size="11.8" font-weight="500" fill="#047857">Python · FiftyOne · Gemini AI</text>
      <text x="366" y="164" text-anchor="end" class="sans" font-size="13.5" font-weight="600" fill="#047857">&#8599;</text>
    
