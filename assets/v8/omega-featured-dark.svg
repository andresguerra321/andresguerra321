<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" fill="none" role="img" aria-label="OMEGA — Plataforma defensiva de Threat Intelligence y análisis forense">
  <defs>
    
    <linearGradient id="omgShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.095"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.032"/>
    </linearGradient>
    <linearGradient id="omgTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.024"/>
    </linearGradient>
    <linearGradient id="omgRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.30)"/>
      <stop offset="38%" stop-color="rgba(167, 243, 208, 0.14)"/>
      <stop offset="72%" stop-color="rgba(16, 185, 129, 0.38)"/>
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0.14)"/>
    </linearGradient>
    <linearGradient id="omgTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(167, 243, 208, 0.44)"/>
      <stop offset="78%" stop-color="rgba(167, 243, 208, 0.44)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="omgSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="omgCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020914" flood-opacity="0.45"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
    <clipPath id="omgClip">
      <rect x="0.5" y="2.5" width="1199" height="247" rx="22"/>
    </clipPath>
    <marker id="secArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#34D399"/>
    </marker>
  </defs>

  
  <g transform="translate(0, 2)">
    <rect x="0.5" y="0.5" width="1199" height="247" rx="22" fill="#071B2E"/>
    <rect x="0.5" y="0.5" width="1199" height="247" rx="22" fill="url(#omgShellBg)" stroke="url(#omgRimStroke)" stroke-width="1"/>
    <line x1="28" y1="1.5" x2="1172" y2="1.5" stroke="url(#omgTopBevel)" stroke-width="1"/>
    
      <g clip-path="url(#omgClip)">
        <g filter="url(#omgSoftBlur)" opacity="0.24">
          <circle cx="140" cy="60" r="140" fill="#10B981"/>
          <circle cx="1020" cy="210" r="150" fill="#06B6D4"/>
        </g>
      </g>

      <!-- Emblem + Title + Security Badge -->
      <circle cx="48" cy="46" r="22" fill="#091E3A" stroke="rgba(110, 231, 183, 0.48)" stroke-width="1.2"/>
      <text x="48" y="54" text-anchor="middle" class="display" font-size="24" font-weight="600" fill="#FFFFFF">&#937;</text>

      <text x="84" y="42" class="display" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#F8FAFC">OMEGA</text>
      <text x="84" y="61" class="sans" font-size="13" font-weight="500" fill="#6EE7B7">Threat Intelligence · Forense Móvil/Host · Modo Zero-Retention</text>

      <rect x="974" y="29" width="200" height="26" rx="13" fill="rgba(16, 185, 129, 0.22)" stroke="rgba(52, 211, 153, 0.48)" stroke-width="1"/>
      <text x="1074" y="46" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#6EE7B7">PROYECTO PRINCIPAL · v1.3.1</text>

      <!-- Value summary -->
      <text x="26" y="102" class="sans" font-size="14" fill="#D1FAE5">Plataforma defensiva para detectar e investigar spyware comercial (Pegasus / Predator), correlacionando</text>
      <text x="26" y="123" class="sans" font-size="14" fill="#D1FAE5">reportes CTI mediante RAG híbrido (pgvector + RRF), triaje MVT/iOS/ADB en RAM y auditoría OSINT pasiva.</text>

      <!-- Compact 3-zone Zero-Retention flow -->
      <g transform="translate(26, 146)">
        <!-- Zone 1 -->
        <rect x="0.5" y="0.5" width="286" height="78" rx="14" fill="#0A233A" stroke="rgba(110, 231, 183, 0.24)" stroke-width="1"/>
        <text x="18" y="24" class="mono" font-size="10.2" font-weight="600" fill="#6EE7B7">CLIENTE HÍBRIDO</text>
        <text x="18" y="45" class="display" font-size="15" font-weight="600" fill="#F8FAFC">React 19 + Electron 45</text>
        <text x="18" y="64" class="sans" font-size="11.8" fill="#94B8C4">Copiloto CTI · IPC local Windows / ADB / iOS</text>

        <line x1="292" y1="39.5" x2="340" y2="39.5" stroke="#34D399" stroke-width="1.8" marker-end="url(#secArrow)"/>
        <text x="316" y="29" text-anchor="middle" class="mono" font-size="9.8" font-weight="600" fill="#6EE7B7">JWT</text>

        <!-- Zone 2 -->
        <rect x="348.5" y="0.5" width="400" height="78" rx="14" fill="#0D2C47" stroke="rgba(52, 211, 153, 0.44)" stroke-width="1.2"/>
        <text x="366" y="24" class="mono" font-size="10.2" font-weight="600" fill="#6EE7B7">GATEWAY · OMEGA-PUBLIC (:8080)</text>
        <text x="366" y="45" class="display" font-size="15" font-weight="600" fill="#F8FAFC">Java 21 · Spring Boot 3.3</text>
        <text x="366" y="64" class="sans" font-size="11.8" fill="#94B8C4">Ingesta tmpfs · RRF híbrido · RBAC · Auditoría SHA-256</text>

        <line x1="754" y1="39.5" x2="804" y2="39.5" stroke="#34D399" stroke-width="1.8" marker-end="url(#secArrow)"/>
        <text x="779" y="29" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#6EE7B7">Token</text>

        <!-- Zone 3 -->
        <rect x="812.5" y="0.5" width="335" height="78" rx="14" fill="#0A233A" stroke="rgba(110, 231, 183, 0.24)" stroke-width="1"/>
        <text x="830" y="24" class="mono" font-size="10.2" font-weight="600" fill="#6EE7B7">OMEGA-PRIVATE · SIN PUERTOS</text>
        <text x="830" y="45" class="display" font-size="15" font-weight="600" fill="#F8FAFC">FastAPI (:memory:) + pgvector</text>
        <text x="830" y="64" class="sans" font-size="11.8" fill="#94B8C4">MVT · YARA · STIX 2.1 · Aislamiento tenant_id</text>
      </g>
    
  </g>
</svg>