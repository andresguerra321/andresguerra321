<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" fill="none" role="img" aria-label="Andrés Felipe Guerra — Fullstack Software Engineer">
  <defs>
    
    <linearGradient id="heroShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.068"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.018"/>
    </linearGradient>
    <linearGradient id="heroTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.016"/>
    </linearGradient>
    <linearGradient id="heroRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.24)"/>
      <stop offset="38%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="72%" stop-color="rgba(96, 165, 250, 0.20)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
    <linearGradient id="heroTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.26)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.26)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="heroSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="heroCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
    <clipPath id="heroOuterClip">
      <rect x="0.5" y="0.5" width="1199" height="317" rx="26"/>
    </clipPath>
    <style>
      @keyframes livePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.42; }
      }
      @keyframes softFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .liveDot { animation: livePulse 3.6s ease-in-out infinite; }
      .floatGlass { animation: softFloat 6.5s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#heroOuterClip)">
    <rect x="0" y="0" width="1200" height="318" fill="#0A0A0E"/>

    <!-- Calm atmospheric ambient light behind translucent stacked glass cards -->
    <g filter="url(#heroSoftBlur)" opacity="0.11">
      <circle cx="956" cy="112" r="142" fill="#3B82F6"/>
      <circle cx="842" cy="222" r="118" fill="#93C5FD"/>
    </g>

    <!-- Subtle hairline grid texture on the right canvas -->
    <g opacity="0.045">
      <line x1="720" y1="0" x2="720" y2="318" stroke="#F5F5F7" stroke-width="1"/>
      <line x1="940" y1="0" x2="940" y2="318" stroke="#F5F5F7" stroke-width="1"/>
      <line x1="680" y1="108" x2="1200" y2="108" stroke="#F5F5F7" stroke-width="1"/>
      <line x1="680" y1="212" x2="1200" y2="212" stroke="#F5F5F7" stroke-width="1"/>
    </g>

    <!-- Left Editorial Column -->
    <g transform="translate(52, 38)">
      <!-- Location & Practice Capsule -->
      <rect x="0.5" y="0.5" width="270" height="29" rx="14.5" fill="#16161C" stroke="url(#heroRimStroke)" stroke-width="1"/>
      <circle cx="16" cy="15" r="3.5" fill="#34D399" class="liveDot"/>
      <text x="29" y="19" class="sans" font-size="11.8" font-weight="500" fill="#C8C8D0">Bucaramanga, CO  ·  AG Engineering</text>

      <!-- Display Name -->
      <text x="0" y="92" class="display" font-size="44" font-weight="600" letter-spacing="-1.45" fill="#F5F5F7">Andrés Felipe Guerra</text>

      <!-- Role Line -->
      <text x="0" y="129" class="display" font-size="20" font-weight="500" letter-spacing="-0.35" fill="#F5F5F7">Fullstack Software Engineer  <tspan fill="#60A5FA">·  AI Systems &amp; AppSec</tspan></text>

      <!-- Editorial Subcopy -->
      <text x="0" y="162" class="sans" font-size="14.5" font-weight="400" fill="#8E8E98">Diseño arquitecturas hexagonales, motores RAG híbridos y tooling defensivo.</text>

      <!-- Frosted Bottom Metadata Dock -->
      <g transform="translate(0, 188)">
        <rect x="0.5" y="0.5" width="618" height="58" rx="16" fill="#111116" stroke="url(#heroRimStroke)" stroke-width="1"/>
        <rect x="0.5" y="0.5" width="618" height="58" rx="16" fill="url(#heroShellBg)"/>
        <line x1="18" y1="1.5" x2="600" y2="1.5" stroke="url(#heroTopBevel)" stroke-width="1"/>

        <text x="20" y="23" class="sans" font-size="10.8" font-weight="500" fill="#8E8E98">Core Stack</text>
        <text x="20" y="42" class="sans" font-size="13.2" font-weight="600" fill="#F5F5F7">Python · Java · React</text>

        <line x1="196" y1="13" x2="196" y2="45" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

        <text x="216" y="23" class="sans" font-size="10.8" font-weight="500" fill="#8E8E98">Arquitectura</text>
        <text x="216" y="42" class="sans" font-size="13.2" font-weight="600" fill="#F5F5F7">DDD · pgvector · Docker</text>

        <line x1="404" y1="13" x2="404" y2="45" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

        <text x="424" y="23" class="sans" font-size="10.8" font-weight="500" fill="#8E8E98">Portfolio</text>
        <text x="424" y="42" class="sans" font-size="13" font-weight="600" fill="#60A5FA">agengineering.workers.dev</text>
      </g>
    </g>

    <!-- Right Spatial Layered Frosted Glass Stack -->
    <g transform="translate(718, 28)">
      <!-- Back Layer (Recessed Context) -->
      <g transform="translate(56, 0)" opacity="0.92">
        <rect x="0.5" y="0.5" width="372" height="84" rx="18" fill="#16161C" filter="url(#heroCardShadow)"/>
        <rect x="0.5" y="0.5" width="372" height="84" rx="18" fill="url(#heroTileBg)" stroke="url(#heroRimStroke)" stroke-width="1"/>
        <line x1="20" y1="1.5" x2="352" y2="1.5" stroke="url(#heroTopBevel)" stroke-width="1"/>
        <text x="20" y="27" class="sans" font-size="12.5" font-weight="600" fill="#F5F5F7">AI Systems &amp; Hybrid RAG</text>
        <text x="352" y="27" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#60A5FA">RRF + Vec</text>
        <text x="20" y="48" class="sans" font-size="11.8" fill="#8E8E98">LangChain · Pydantic · pgvector 768d</text>
      </g>

      <!-- Middle Elevated Frosted Layer (Spotlight Feature) -->
      <g class="floatGlass">
        
  <g transform="translate(10, 72)" filter="url(#heroCardShadow)">
    <rect x="0.5" y="0.5" width="415" height="123" rx="20" fill="#111116"/>
    <rect x="0.5" y="0.5" width="415" height="123" rx="20" fill="url(#heroShellBg)" stroke="url(#heroRimStroke)" stroke-width="1"/>
    <line x1="26" y1="1.5" x2="390" y2="1.5" stroke="url(#heroTopBevel)" stroke-width="1"/>
    
            
  <g transform="translate(20, 20)">
    <rect x="0.5" y="0.5" width="33" height="33" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <g transform="translate(8, 8)">
      <path d="M9 2.5L14.5 4.8V8.8C14.5 12.1 12.1 14.6 9 15.6C5.9 14.6 3.5 12.1 3.5 8.8V4.8L9 2.5Z" stroke="#60A5FA" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.7 9.1L8.3 10.7L11.6 7.4" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
            <text x="66" y="35" class="display" font-size="15.5" font-weight="600" letter-spacing="-0.2" fill="#F5F5F7">OMEGA Platform</text>
            <text x="66" y="51" class="sans" font-size="11.8" fill="#8E8E98">Threat Intelligence &amp; Forensics</text>
            <rect x="328" y="21" width="68" height="23" rx="11.5" fill="rgba(59, 130, 246, 0.16)" stroke="rgba(96, 165, 250, 0.34)" stroke-width="1"/>
            <text x="362" y="36" text-anchor="middle" class="mono" font-size="10.8" font-weight="600" fill="#60A5FA">v1.3.1</text>
            <line x1="20" y1="69" x2="396" y2="69" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
            
    <g transform="translate(20, 83)">
      <rect x="0" y="0" width="63" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="31.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">Java 21</text>
    </g>
    <g transform="translate(91, 83)">
      <rect x="0" y="0" width="96" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="48" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">Spring Boot 3</text>
    </g>
    <g transform="translate(195, 83)">
      <rect x="0" y="0" width="65" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="32.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">FastAPI</text>
    </g>
    <g transform="translate(268, 83)">
      <rect x="0" y="0" width="69" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="34.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">Electron</text>
    </g>
          
  </g>
      </g>

      <!-- Front Compact Frosted Pill Layer -->
      <g transform="translate(66, 208)">
        <rect x="0.5" y="0.5" width="364" height="58" rx="16" fill="#16161C" filter="url(#heroCardShadow)"/>
        <rect x="0.5" y="0.5" width="364" height="58" rx="16" fill="url(#heroTileBg)" stroke="url(#heroRimStroke)" stroke-width="1"/>
        <line x1="18" y1="1.5" x2="346" y2="1.5" stroke="url(#heroTopBevel)" stroke-width="1"/>
        
  <g transform="translate(14, 12)">
    <rect x="0.5" y="0.5" width="33" height="33" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <g transform="translate(8, 8)">
      <path d="M9 2.8L15.4 6.1L9 9.4L2.6 6.1L9 2.8Z" stroke="#F5F5F7" stroke-width="1.5" stroke-linejoin="round"/><path d="M2.6 9.3L9 12.6L15.4 9.3M2.6 12.4L9 15.7L15.4 12.4" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
        <text x="60" y="27" class="sans" font-size="12.5" font-weight="600" fill="#F5F5F7">Backend · Cloud · Automation</text>
        <text x="60" y="44" class="sans" font-size="11.5" fill="#8E8E98">Hexagonal DDD · PostgreSQL 16 · Baileys · n8n</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="317" rx="26" stroke="url(#heroRimStroke)" stroke-width="1"/>
  <line x1="30" y1="1.5" x2="1170" y2="1.5" stroke="url(#heroTopBevel)" stroke-width="1"/>
</svg>