<svg xmlns="http://www.w3.org/2000/svg" width="590" height="218" viewBox="0 0 590 218" fill="none" role="img" aria-label="OMEGA — Threat Intelligence &amp; Forense">
  <defs>
    
    <linearGradient id="projShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="projTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="projRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
