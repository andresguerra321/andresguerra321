      <text x="38" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">LangChain</text>
    </g>
    <g transform="translate(199, 159)">
      <rect x="0" y="0" width="69" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="34.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">Pydantic</text>
    </g>
    <g transform="translate(275, 159)">
      <rect x="0" y="0" width="58" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="29" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">OpenAI</text>
    </g>
    <g transform="translate(340, 159)">
      <rect x="0" y="0" width="57" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="28.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">Gemini</text>
    </g>
    <g transform="translate(404, 159)">
      <rect x="0" y="0" width="76" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.11)" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#C8C8D0">Streamlit</text>
