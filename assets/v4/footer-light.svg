<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="68" viewBox="0 0 1200 68" fill="none" role="img" aria-label="Andrés Felipe Guerra · AG Engineering">
  <defs>
    
    <linearGradient id="ftrShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="ftrTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="ftrRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.08)"/>
      <stop offset="38%" stop-color="rgba(15, 23, 42, 0.11)"/>
      <stop offset="72%" stop-color="rgba(29, 78, 216, 0.22)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.09)"/>
    </linearGradient>
    <linearGradient id="ftrTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.98)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.98)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ftrSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="ftrCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.075"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>
  
  <g transform="translate(0, 4)" filter="url(#ftrCardShadow)">
    <rect x="0.5" y="0.5" width="1199" height="57" rx="18" fill="#F7F8FA"/>
    <rect x="0.5" y="0.5" width="1199" height="57" rx="18" fill="url(#ftrShellBg)" stroke="url(#ftrRimStroke)" stroke-width="1"/>
    <line x1="24" y1="1.5" x2="1176" y2="1.5" stroke="url(#ftrTopBevel)" stroke-width="1"/>
    
      <text x="26" y="33" class="sans" font-size="13" font-weight="600" letter-spacing="-0.1" fill="#1D1D1F">Andrés Felipe Guerra  <tspan font-weight="400" fill="#686870">·  AG Engineering  ·  Bucaramanga, Colombia</tspan></text>
      <text x="1174" y="33" text-anchor="end" class="sans" font-size="12.5" font-weight="600" fill="#1D4ED8">portfolio.agengineering.workers.dev  &#8599;</text>
    
  </g>
