<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" fill="none" role="img" aria-label="Andrés Felipe Guerra — Fullstack Engineer">
  <defs>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .liveDot { animation: breathe 3.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Flat Apple Surface (zero gradients, zero mesh/glow) -->
  <rect x="0.5" y="0.5" width="1199" height="275" rx="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>

  <!-- Left Apple Editorial Stack -->
  <g transform="translate(56, 44)">
    <!-- Minimal Status Pill -->
    <rect x="0" y="0" width="218" height="28" rx="14" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="1"/>
    <circle cx="15" cy="14" r="3.5" fill="#1D4ED8" class="liveDot"/>
    <text x="27" y="18" class="sans" font-size="12" font-weight="500" fill="#515154">Available  ·  Colombia</text>

    <!-- Command Headline -->
    <text x="0" y="84" class="display" font-size="50" font-weight="600" letter-spacing="-1.6" fill="#1D1D1F">Andrés Felipe Guerra</text>

    <!-- Apple Two-Tone Tagline -->
    <text x="0" y="122" class="display" font-size="21" font-weight="500" letter-spacing="-0.3" fill="#515154">Fullstack Software Engineer.  <tspan fill="#1D4ED8">AI Systems &amp; Security.</tspan></text>

    <!-- Clean Apple Spec Bar -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="840" height="46" rx="14" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>

      <text x="20" y="19" class="sans" font-size="10.5" font-weight="500" fill="#86868B">Focus</text>
      <text x="20" y="36" class="sans" font-size="13" font-weight="600" fill="#1D1D1F">Hybrid RAG · DDD · CTI</text>

      <line x1="250" y1="10" x2="250" y2="36" stroke="#E5E5EA" stroke-width="1"/>

      <text x="272" y="19" class="sans" font-size="10.5" font-weight="500" fill="#86868B">Core Stack</text>
      <text x="272" y="36" class="sans" font-size="13" font-weight="600" fill="#1D1D1F">Python · Java · React · SQL</text>

      <line x1="538" y1="10" x2="538" y2="36" stroke="#E5E5EA" stroke-width="1"/>

      <text x="560" y="19" class="sans" font-size="10.5" font-weight="500" fill="#86868B">Portfolio</text>
      <text x="560" y="36" class="sans" font-size="13" font-weight="600" fill="#1D4ED8">portfolio.agengineering.workers.dev</text>
    </g>
  </g>

  <!-- Right Minimal Apple Squircle Monogram Tile -->
  <g transform="translate(972, 62)">
    <rect x="0.5" y="0.5" width="152" height="152" rx="36" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
    <rect x="60" y="18" width="32" height="3" rx="1.5" fill="#1D4ED8"/>
    <text x="76" y="94" text-anchor="middle" class="display" font-size="52" font-weight="700" letter-spacing="-2.4" fill="#1D1D1F">AG<tspan fill="#1D4ED8">.</tspan></text>
    <text x="76" y="124" text-anchor="middle" class="sans" font-size="11" font-weight="500" letter-spacing="0.4" fill="#86868B">Engineering</text>
  </g>
</svg>