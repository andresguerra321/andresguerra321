  <rect x="0.5" y="0.5" width="99" height="37" rx="19" fill="#0C236B"/>
  <rect x="0.5" y="0.5" width="99" height="37" rx="19" fill="url(#btnShellBg)"/>
  <rect x="0.5" y="0.5" width="99" height="37" rx="19" stroke="url(#btnRimStroke)" stroke-width="1"/>
  <line x1="18" y1="1.5" x2="82" y2="1.5" stroke="url(#btnTopBevel)" stroke-width="1"/>
