<svg xmlns="http://www.w3.org/2000/svg" width="386" height="190" viewBox="0 0 386 190" fill="none" role="img" aria-label="CV Intelligence — Evaluador de Hojas de Vida">
  <defs>
    
    <linearGradient id="secShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
