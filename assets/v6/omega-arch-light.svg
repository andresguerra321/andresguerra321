<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="406" viewBox="0 0 1200 406" fill="none" role="img" aria-label="Arquitectura Zero-Retention y Benchmarks de OMEGA">
  <defs>
    
    <linearGradient id="omgShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F2FBF7" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="omgTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="omgRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.08)"/>
      <stop offset="38%" stop-color="rgba(4, 120, 87, 0.14)"/>
      <stop offset="72%" stop-color="rgba(5, 150, 105, 0.30)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.08)"/>
    </linearGradient>
    <linearGradient id="omgTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.98)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.98)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="omgSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="omgCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064E3B" flood-opacity="0.07"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
    <clipPath id="omgClip">
      <rect x="0.5" y="2.5" width="1199" height="401" rx="22"/>
    </clipPath>
    <marker id="secArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#059669"/>
    </marker>
  </defs>

  
  <g transform="translate(0, 2)" filter="url(#omgCardShadow)">
    <rect x="0.5" y="0.5" width="1199" height="401" rx="22" fill="#F6FCF9"/>
    <rect x="0.5" y="0.5" width="1199" height="401" rx="22" fill="url(#omgShellBg)" stroke="url(#omgRimStroke)" stroke-width="1"/>
    <line x1="28" y1="1.5" x2="1172" y2="1.5" stroke="url(#omgTopBevel)" stroke-width="1"/>
    
      <g clip-path="url(#omgClip)">
        <g filter="url(#omgSoftBlur)" opacity="0.13">
          <circle cx="210" cy="70" r="140" fill="#10B981"/>
          <circle cx="960" cy="300" r="160" fill="#0891B2"/>
        </g>
      </g>

      <!-- Header -->
      <circle cx="34" cy="34" r="5" fill="#059669"/>
      <circle cx="34" cy="34" r="9" fill="#059669" fill-opacity="0.18"/>
      <text x="54" y="39" class="display" font-size="16" font-weight="600" letter-spacing="-0.25" fill="#0F172A">Arquitectura Zero-Retention &amp; Pipeline Forense</text>
      <text x="54" y="57" class="sans" font-size="12.2" fill="#475569">Segregación de redes Docker (omega-public / omega-private) · evitación de persistencia en disco</text>

      <rect x="974" y="24" width="198" height="26" rx="13" fill="rgba(5, 150, 105, 0.11)" stroke="rgba(5, 150, 105, 0.32)" stroke-width="1"/>
      <text x="1073" y="40.5" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#047857">v1.3.1 · Security Focus</text>

      <line x1="28" y1="74" x2="1172" y2="74" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>

      <!-- Zone 1: Client Web / Desktop -->
      <g transform="translate(28, 90)">
        <rect x="0.5" y="0.5" width="268" height="202" rx="16" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.22)" stroke-width="1"/>
        <rect x="0.5" y="0.5" width="268" height="202" rx="16" fill="url(#omgTileBg)"/>
        <line x1="20" y1="1.5" x2="248" y2="1.5" stroke="url(#omgTopBevel)" stroke-width="1"/>

        <rect x="18" y="18" width="114" height="21" rx="10.5" fill="rgba(5, 150, 105, 0.09)"/>
        <text x="75" y="32" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#047857">CLIENTE HÍBRIDO</text>

        <text x="18" y="64" class="display" font-size="16.5" font-weight="600" letter-spacing="-0.25" fill="#0F172A">React 19 + Electron 45</text>
        <text x="18" y="88" class="sans" font-size="12.5" fill="#1E293B">Cabina de postura en vivo</text>
        <text x="18" y="106" class="sans" font-size="12.5" fill="#1E293B">y copiloto CTI con citas.</text>

        <rect x="18" y="124" width="232" height="58" rx="10" fill="rgba(236, 253, 245, 0.65)" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>
        <text x="30" y="145" class="sans" font-size="11.8" font-weight="600" fill="#0F172A">Canal IPC local</text>
        <text x="30" y="164" class="mono" font-size="10.8" fill="#475569">Windows · ADB · iOS (RAM)</text>
      </g>

      <!-- Connector 1: Client -> Gateway -->
      <line x1="300" y1="191" x2="348" y2="191" stroke="#059669" stroke-width="1.8" marker-end="url(#secArrow)"/>
      <text x="324" y="179" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#047857">JWT</text>

      <!-- Zone 2: Java Zero-Retention Gateway -->
      <g transform="translate(356, 90)">
        <rect x="0.5" y="0.5" width="434" height="202" rx="16" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.36)" stroke-width="1.2"/>
        <rect x="0.5" y="0.5" width="434" height="202" rx="16" fill="url(#omgTileBg)"/>
        <line x1="22" y1="1.5" x2="412" y2="1.5" stroke="url(#omgTopBevel)" stroke-width="1"/>

        <rect x="18" y="18" width="160" height="21" rx="10.5" fill="rgba(5, 150, 105, 0.11)" stroke="rgba(5, 150, 105, 0.32)" stroke-width="1"/>
        <text x="98" y="32" text-anchor="middle" class="mono" font-size="10.2" font-weight="600" fill="#047857">OMEGA-PUBLIC · :8080</text>
        <text x="416" y="32" text-anchor="end" class="mono" font-size="10.8" font-weight="600" fill="#475569">Spring Boot 3.3 · Java 21</text>

        <!-- Submodule A -->
        <rect x="18" y="52" width="398" height="42" rx="10" fill="rgba(236, 253, 245, 0.65)" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>
        <text x="30" y="69" class="sans" font-size="12.2" font-weight="600" fill="#0F172A">Ingesta Zero-Retention (tmpfs)</text>
        <text x="30" y="85" class="sans" font-size="11.2" fill="#475569">PDFBox AST, OCR Tess4J y borrado físico en finally</text>

        <!-- Submodule B -->
        <rect x="18" y="100" width="398" height="42" rx="10" fill="rgba(236, 253, 245, 0.65)" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>
        <text x="30" y="117" class="sans" font-size="12.2" font-weight="600" fill="#0F172A">Motor RAG Híbrido + STIX 2.1</text>
        <text x="30" y="133" class="sans" font-size="11.2" fill="#475569">RRF (pgvector + tsvector) con citas por tenant y página</text>

        <!-- Submodule C -->
        <rect x="18" y="148" width="398" height="42" rx="10" fill="rgba(236, 253, 245, 0.65)" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>
        <text x="30" y="165" class="sans" font-size="12.2" font-weight="600" fill="#0F172A">Guardrails &amp; Auditoría SHA-256</text>
        <text x="30" y="181" class="sans" font-size="11.2" fill="#475569">RBAC, anti-IDOR, anti-Zip-Slip y cadena probatoria</text>
      </g>

      <!-- Dual Connectors: Gateway -> Private Network -->
      <path d="M 792 145 L 842 145" stroke="#059669" stroke-width="1.8" marker-end="url(#secArrow)"/>
      <text x="817" y="133" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#047857">Token</text>

      <path d="M 792 239 L 842 239" stroke="#059669" stroke-width="1.8" marker-end="url(#secArrow)"/>
      <text x="817" y="227" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#047857">HNSW</text>

      <!-- Zone 3: Isolated Private Network (Forensic Worker + Postgres) -->
      <g transform="translate(850, 90)">
        <!-- Worker -->
        <rect x="0.5" y="0.5" width="322" height="94" rx="15" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.22)" stroke-width="1"/>
        <rect x="0.5" y="0.5" width="322" height="94" rx="15" fill="url(#omgTileBg)"/>
        <text x="16" y="24" class="mono" font-size="10" font-weight="600" fill="#047857">OMEGA-PRIVATE · SIN PUERTOS</text>
        <text x="16" y="46" class="display" font-size="14.8" font-weight="600" fill="#0F172A">Worker Forense FastAPI</text>
        <text x="16" y="65" class="sans" font-size="11.8" fill="#1E293B">MVT, YARA e iOS (:memory:) 100% en RAM</text>
        <text x="16" y="82" class="mono" font-size="10.5" fill="#475569">Fail-closed 401/503 · 0B retenidos</text>

        <!-- Postgres -->
        <rect x="0.5" y="108.5" width="322" height="94" rx="15" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.22)" stroke-width="1"/>
        <rect x="0.5" y="108.5" width="322" height="94" rx="15" fill="url(#omgTileBg)"/>
        <text x="16" y="132" class="mono" font-size="10" font-weight="600" fill="#047857">PERSISTENCIA AISLADA · FLYWAY V1–V3</text>
        <text x="16" y="154" class="display" font-size="14.8" font-weight="600" fill="#0F172A">PostgreSQL 16 + pgvector</text>
        <text x="16" y="173" class="sans" font-size="11.8" fill="#1E293B">Índices HNSW + GIN y catálogo STIX 2.1</text>
        <text x="16" y="190" class="mono" font-size="10.5" fill="#475569">audit_logs inmutable (trigger anti-UPDATE)</text>
      </g>

      <!-- Bottom Verified Benchmarks Strip -->
      <g transform="translate(28, 310)">
        <rect x="0.5" y="0.5" width="1144" height="72" rx="15" fill="#FFFFFF" stroke="rgba(5, 150, 105, 0.22)" stroke-width="1"/>

        <text x="24" y="24" class="sans" font-size="11.2" font-weight="500" fill="#475569">Recuperación RAG (Hit@5)</text>
        <text x="24" y="48" class="display" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#047857">85.7% <tspan font-size="12" font-weight="500" fill="#475569">(vs. 28.6% base)</tspan></text>

        <line x1="286" y1="14" x2="286" y2="58" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>

        <text x="310" y="24" class="sans" font-size="11.2" font-weight="500" fill="#475569">Control Anti-Alucinación</text>
        <text x="310" y="48" class="display" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#0F172A">100% <tspan font-size="12" font-weight="500" fill="#475569">abstención RNF1</tspan></text>

        <line x1="572" y1="14" x2="572" y2="58" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>

        <text x="596" y="24" class="sans" font-size="11.2" font-weight="500" fill="#475569">Inteligencia STIX 2.1</text>
        <text x="596" y="48" class="display" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#0F172A">6,404 IOCs <tspan font-size="12" font-weight="500" fill="#475569">en 6 campañas</tspan></text>

        <line x1="858" y1="14" x2="858" y2="58" stroke="rgba(6, 78, 59, 0.11)" stroke-width="1"/>

        <text x="882" y="24" class="sans" font-size="11.2" font-weight="500" fill="#475569">Latencia Media &amp; Disco</text>
        <text x="882" y="48" class="display" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#047857">1.22s <tspan font-size="12" font-weight="500" fill="#475569">· 0B retenidos</tspan></text>
      </g>
    
  </g>
</svg>