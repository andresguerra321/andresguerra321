<svg xmlns="http://www.w3.org/2000/svg" width="590" height="218" viewBox="0 0 590 218" fill="none" role="img" aria-label="WA-Bot — Agente Conversacional WhatsApp">
  <defs>
    
    <linearGradient id="projShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="projTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.095"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.028"/>
    </linearGradient>
    <linearGradient id="projRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.34)"/>
      <stop offset="38%" stop-color="rgba(191, 219, 254, 0.14)"/>
      <stop offset="72%" stop-color="rgba(96, 165, 250, 0.32)"/>
      <stop offset="100%" stop-color="rgba(147, 197, 253, 0.09)"/>
    </linearGradient>
    <linearGradient id="projTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="projSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="projCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020824" flood-opacity="0.42"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>
  
  <g transform="translate(0, 2)">
    <rect x="0.5" y="0.5" width="589" height="209" rx="20" fill="#0C236B"/>
    <rect x="0.5" y="0.5" width="589" height="209" rx="20" fill="url(#projShellBg)" stroke="url(#projRimStroke)" stroke-width="1"/>
    <line x1="26" y1="1.5" x2="564" y2="1.5" stroke="url(#projTopBevel)" stroke-width="1"/>
    
      
  <g transform="translate(24, 22)">
    <rect x="0.5" y="0.5" width="37" height="37" rx="10" fill="rgba(255, 255, 255, 0.09)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <path d="M9 2.6C5.3 2.6 2.5 5.1 2.5 8.2C2.5 9.6 3.1 10.9 4.1 11.9L3.3 14.8L6.4 13.7C7.2 14 8.1 14.2 9 14.2C12.7 14.2 15.5 11.5 15.5 8.2C15.5 5.1 12.7 2.6 9 2.6Z" stroke="#BFDBFE" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
      <text x="74" y="39" class="display" font-size="18.5" font-weight="600" letter-spacing="-0.35" fill="#F8FAFC">WA-Bot</text>
      <text x="74" y="56" class="sans" font-size="12.2" font-weight="500" fill="#B4C7F4">Agente Conversacional WhatsApp</text>

      <!-- Top-Right Frosted Status Badge -->
      <rect x="436" y="23" width="130" height="24" rx="12" fill="rgba(37, 99, 235, 0.34)" stroke="rgba(191, 219, 254, 0.44)" stroke-width="1"/>
      <text x="501" y="38.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#BFDBFE">Self-Hosted 24/7</text>

      <!-- Description -->
      <text x="24" y="96" class="sans" font-size="13.5" font-weight="400" fill="#DCE6FF">Asistente IA para agendamiento y soporte continuo con memoria de</text>
      <text x="24" y="117" class="sans" font-size="13.5" font-weight="400" fill="#DCE6FF">sesión, botones interactivos y Groq/LLaMA sin tarifa por mensaje.</text>

      <!-- Divider & Stack Pills -->
      <line x1="24" y1="144" x2="566" y2="144" stroke="rgba(191, 219, 254, 0.16)" stroke-width="1"/>
      
    <g transform="translate(24, 159)">
