<svg xmlns="http://www.w3.org/2000/svg" width="590" height="218" viewBox="0 0 590 218" fill="none" role="img" aria-label="SST &amp; PESV Multi-Tenant DB — Arquitectura Relacional &amp; Auditoría">
  <defs>
    
    <linearGradient id="projShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="projTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.095"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.028"/>
    </linearGradient>
    <linearGradient id="projRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.34)"/>
      <stop offset="38%" stop-color="rgba(191, 219, 254, 0.14)"/>
      <stop offset="72%" stop-color="rgba(96, 165, 250, 0.32)"/>
      <stop offset="100%" stop-color="rgba(147, 197, 253, 0.09)"/>
    </linearGradient>
    <linearGradient id="projTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="projSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="projCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020824" flood-opacity="0.42"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>
  
  <g transform="translate(0, 2)">
    <rect x="0.5" y="0.5" width="589" height="209" rx="20" fill="#0C236B"/>
    <rect x="0.5" y="0.5" width="589" height="209" rx="20" fill="url(#projShellBg)" stroke="url(#projRimStroke)" stroke-width="1"/>
    <line x1="26" y1="1.5" x2="564" y2="1.5" stroke="url(#projTopBevel)" stroke-width="1"/>
    
      
  <g transform="translate(24, 22)">
    <rect x="0.5" y="0.5" width="37" height="37" rx="10" fill="rgba(255, 255, 255, 0.09)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <ellipse cx="9" cy="4.8" rx="5.5" ry="2.1" stroke="#BFDBFE" stroke-width="1.5"/><path d="M3.5 4.8V13.2C3.5 14.4 5.9 15.3 9 15.3C12.1 15.3 14.5 14.4 14.5 13.2V4.8M3.5 9C3.5 10.2 5.9 11.1 9 11.1C12.1 11.1 14.5 10.2 14.5 9" stroke="#BFDBFE" stroke-width="1.5"/>
    </g>
  </g>
      <text x="74" y="39" class="display" font-size="18.5" font-weight="600" letter-spacing="-0.35" fill="#F8FAFC">SST &amp; PESV Multi-Tenant DB</text>
      <text x="74" y="56" class="sans" font-size="12.2" font-weight="500" fill="#B4C7F4">Arquitectura Relacional &amp; Auditoría</text>

      <!-- Top-Right Frosted Status Badge -->
      <rect x="430" y="23" width="136" height="24" rx="12" fill="rgba(37, 99, 235, 0.34)" stroke="rgba(191, 219, 254, 0.44)" stroke-width="1"/>
      <text x="498" y="38.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#BFDBFE">PostgreSQL · PHVA</text>

      <!-- Description -->
      <text x="24" y="96" class="sans" font-size="13.5" font-weight="400" fill="#DCE6FF">Base de datos aislada por tenant en PostgreSQL para gestión normativa</text>
      <text x="24" y="117" class="sans" font-size="13.5" font-weight="400" fill="#DCE6FF">SG-SST y PESV con concurrencia segura, triggers y vistas materializadas.</text>

      <!-- Divider & Stack Pills -->
      <line x1="24" y1="144" x2="566" y2="144" stroke="rgba(191, 219, 254, 0.16)" stroke-width="1"/>
      
    <g transform="translate(24, 159)">
      <rect x="0" y="0" width="87" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="43.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">PostgreSQL</text>
    </g>
    <g transform="translate(118, 159)">
      <rect x="0" y="0" width="76" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">PL/pgSQL</text>
    </g>
    <g transform="translate(201, 159)">
      <rect x="0" y="0" width="94" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="47" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">Multi-Tenant</text>
    </g>
    <g transform="translate(302, 159)">
      <rect x="0" y="0" width="59" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="29.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">Docker</text>
    </g>
    
  </g>
</svg>