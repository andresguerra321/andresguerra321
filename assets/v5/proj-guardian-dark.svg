<svg xmlns="http://www.w3.org/2000/svg" width="590" height="218" viewBox="0 0 590 218" fill="none" role="img" aria-label="GUARDIAN — Seguridad Vial Multi-Agente">
  <defs>
    
    <linearGradient id="projShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="projTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.095"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.028"/>
    </linearGradient>
    <linearGradient id="projRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.34)"/>
      <stop offset="38%" stop-color="rgba(191, 219, 254, 0.14)"/>
      <stop offset="72%" stop-color="rgba(96, 165, 250, 0.32)"/>
      <stop offset="100%" stop-color="rgba(147, 197, 253, 0.09)"/>
    </linearGradient>
    <linearGradient id="projTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="projSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="projCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020824" flood-opacity="0.42"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>
  
  <g transform="translate(0, 2)">
    <rect x="0.5" y="0.5" width="589" height="209" rx="20" fill="#0C236B"/>
    <rect x="0.5" y="0.5" width="589" height="209" rx="20" fill="url(#projShellBg)" stroke="url(#projRimStroke)" stroke-width="1"/>
    <line x1="26" y1="1.5" x2="564" y2="1.5" stroke="url(#projTopBevel)" stroke-width="1"/>
    
      
  <g transform="translate(24, 22)">
    <rect x="0.5" y="0.5" width="37" height="37" rx="10" fill="rgba(255, 255, 255, 0.09)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <path d="M2.4 9C3.9 5.9 6.3 4.4 9 4.4C11.7 4.4 14.1 5.9 15.6 9C14.1 12.1 11.7 13.6 9 13.6C6.3 13.6 3.9 12.1 2.4 9Z" stroke="#BFDBFE" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.2" stroke="#BFDBFE" stroke-width="1.5"/>
    </g>
  </g>
      <text x="74" y="39" class="display" font-size="18.5" font-weight="600" letter-spacing="-0.35" fill="#F8FAFC">GUARDIAN</text>
      <text x="74" y="56" class="sans" font-size="12.2" font-weight="500" fill="#B4C7F4">Seguridad Vial Multi-Agente</text>

      <!-- Top-Right Frosted Status Badge -->
      <rect x="443" y="23" width="123" height="24" rx="12" fill="rgba(37, 99, 235, 0.34)" stroke="rgba(191, 219, 254, 0.44)" stroke-width="1"/>
      <text x="504.5" y="38.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#BFDBFE">Computer Vision</text>

      <!-- Description -->
      <text x="24" y="96" class="sans" font-size="13.5" font-weight="400" fill="#DCE6FF">Sistema predictivo para transporte terrestre con visión computacional</text>
      <text x="24" y="117" class="sans" font-size="13.5" font-weight="400" fill="#DCE6FF">y tres agentes (Copiloto · Centinela · Oráculo) sobre Voxel51 FiftyOne.</text>

      <!-- Divider & Stack Pills -->
      <line x1="24" y1="144" x2="566" y2="144" stroke="rgba(191, 219, 254, 0.16)" stroke-width="1"/>
      
    <g transform="translate(24, 159)">
      <rect x="0" y="0" width="59" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="29.5" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">Python</text>
    </g>
    <g transform="translate(90, 159)">
      <rect x="0" y="0" width="116" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="58" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">Voxel51 FiftyOne</text>
    </g>
    <g transform="translate(213, 159)">
      <rect x="0" y="0" width="72" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="36" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">Gemini AI</text>
    </g>
    <g transform="translate(292, 159)">
      <rect x="0" y="0" width="88" height="26" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(191, 219, 254, 0.20)" stroke-width="1"/>
      <text x="44" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#DCE6FF">Multi-Agent</text>
    </g>
    
  </g>
</svg>