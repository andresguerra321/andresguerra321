<svg xmlns="http://www.w3.org/2000/svg" width="124" height="38" viewBox="0 0 124 38" fill="none" role="img" aria-label="Portfolio">
  <defs>
    
    <linearGradient id="btnShellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="btnTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.095"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.028"/>
    </linearGradient>
    <linearGradient id="btnRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.34)"/>
      <stop offset="38%" stop-color="rgba(191, 219, 254, 0.14)"/>
      <stop offset="72%" stop-color="rgba(96, 165, 250, 0.32)"/>
      <stop offset="100%" stop-color="rgba(147, 197, 253, 0.09)"/>
    </linearGradient>
    <linearGradient id="btnTopBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="78%" stop-color="rgba(255, 255, 255, 0.36)"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="btnSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="btnCardShadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020824" flood-opacity="0.42"/>
    </filter>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="123" height="37" rx="19" fill="#0C236B"/>
  <rect x="0.5" y="0.5" width="123" height="37" rx="19" fill="rgba(29, 78, 216, 0.72)"/>
  <rect x="0.5" y="0.5" width="123" height="37" rx="19" stroke="rgba(191, 219, 254, 0.58)" stroke-width="1"/>
  <line x1="18" y1="1.5" x2="106" y2="1.5" stroke="url(#btnTopBevel)" stroke-width="1"/>
  <g transform="translate(15, 10)">
    <circle cx="9" cy="9" r="6.8" stroke="#FFFFFF" stroke-width="1.5"/><ellipse cx="9" cy="9" rx="3" ry="6.8" stroke="#FFFFFF" stroke-width="1.3"/><line x1="2.4" y1="9" x2="15.6" y2="9" stroke="#FFFFFF" stroke-width="1.3"/>
