<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" fill="none" role="img" aria-label="Andrés Felipe Guerra — Fullstack Engineer">
  <defs>
    <style>
      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.42; }
      }
      .liveDot { animation: breathe 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Flat Apple Obsidian / Alabaster Surface -->
  <rect x="0.5" y="0.5" width="1199" height="271" rx="22" fill="#0B0B0E" stroke="#232329" stroke-width="1"/>

  <!-- Left Typographic Composition -->
  <g transform="translate(56, 48)">
    <!-- Minimal Availability Capsule -->
    <rect x="0" y="0" width="214" height="28" rx="14" fill="#16161B" stroke="#26262E" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#60A5FA" class="liveDot"/>
    <text x="29" y="18" class="sans" font-size="12" font-weight="500" letter-spacing="0.2" fill="#A1A1AA">Available for work  ·  2026</text>

    <!-- Display Headline -->
    <text x="0" y="84" class="display" font-size="46" font-weight="600" letter-spacing="-1.4" fill="#F5F5F7">Andrés Felipe Guerra</text>

    <!-- Role Statement -->
    <text x="0" y="118" class="sans" font-size="19" font-weight="400" letter-spacing="-0.2" fill="#A1A1AA">Fullstack Engineer designing AI systems, clean backends &amp; security tools.</text>

    <!-- Hairline Rule -->
    <line x1="0" y1="148" x2="760" y2="148" stroke="#1D1D22" stroke-width="1"/>

    <!-- Minimal Metadata Row -->
    <text x="0" y="178" class="sans" font-size="13" font-weight="500" fill="#71717A">Bucaramanga, Colombia     ·     <tspan fill="#A1A1AA">AG Engineering</tspan>     ·     <tspan fill="#60A5FA">portfolio.agengineering.workers.dev</tspan></text>
  </g>

  <!-- Right Minimal Apple Squircle Monogram Tile (Zero gradients, zero rings) -->
  <g transform="translate(964, 56)">
    <rect x="0.5" y="0.5" width="160" height="160" rx="34" fill="#121216" stroke="#232329" stroke-width="1"/>
    <text x="80" y="96" text-anchor="middle" class="display" font-size="54" font-weight="700" letter-spacing="-2.5" fill="#F5F5F7">AG<tspan fill="#60A5FA">.</tspan></text>
    <text x="80" y="128" text-anchor="middle" class="mono" font-size="10.5" font-weight="500" letter-spacing="1.4" fill="#71717A">COLOMBIA</text>
  </g>
</svg>